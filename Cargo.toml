[package]
name = "gingersnaps"
license = "MIT"
authors = ["Bethany Davis <ellis@despoena.com>"]
description = "An Apron compatible system in the spirit of BBSs, newsgroups, and forums."
repository = "https://github.com/countessellis/gingersnaps"
version = "0.1.0"
edition = "2024"
default-run = "gingersnaps"

[lib]
name = "gingersnaps"
path = "src/lib.rs"

[dependencies]
crossbeam-channel = "0.5"
env_logger = "0.11"
log = "0.4"
mimalloc = "0.1"
nu-ansi-term = "0.50"
regex = "1.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tiny_http = { version = "0.12", features = ["ssl-openssl"] }
openssl = { version = "0.10", features = ["vendored"] }
tungstenite = "0.30"
url = "2.5"

[build-dependencies]
chrono = "0.4"

[profile.dev]
opt-level = 1
debug = true

[profile.release]
opt-level = 3
strip = true
lto = true
codegen-units = 1
panic = "abort"
debug-assertions = false
overflow-checks = false
package."*".opt-level = "s"
